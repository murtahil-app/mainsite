<!doctype html>
<!-- The social card, 1200 x 630. Rendered to public/og-<lang>.png by scripts/og/render.py. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@500;600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { background: #063400; color: #eef5ee; font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", sans-serif; position: relative; overflow: hidden; }
  body[dir="rtl"] { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; }
  .copy { position: absolute; inset-inline-start: 72px; top: 72px; width: 640px; display: flex; flex-direction: column; gap: 28px; z-index: 2; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img { height: 56px; }
  .names { display: flex; flex-direction: column; gap: 6px; }
  .latin { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .arabic { font-family: "IBM Plex Sans Arabic"; font-size: 21px; font-weight: 500; line-height: 1.15; }
  h1 { font-size: 64px; line-height: 1.04; font-weight: 600; letter-spacing: -0.045em; }
  body[dir="rtl"] h1 { letter-spacing: 0; line-height: 1.3; font-size: 62px; }
  p { font-size: 26px; color: #a9bbac; line-height: 1.4; }
  /* The site's iPhone frame (components/phone.tsx) at 280 px: titanium band, bezel, Dynamic Island. */
  .phone { position: absolute; inset-inline-end: 84px; top: 58px; width: 280px; border-radius: 48px; padding: 3.4px; z-index: 2;
           background: linear-gradient(155deg,#64656a 0%,#2c2d31 16%,#1c1d20 50%,#2c2d31 84%,#56575c 100%);
           box-shadow: inset 0 0 0 0.8px rgba(255,255,255,0.1), 0 40px 80px -20px rgba(0,0,0,0.6); }
  .bezel { border-radius: 45px; background: #000; padding: 9px; }
  .screen { position: relative; overflow: hidden; border-radius: 36px; background: #000; }
  .screen img { display: block; width: 100%; }
  .island { position: absolute; left: 50%; transform: translateX(-50%); top: 7.2px; width: 82.5px; height: 24.2px; border-radius: 999px; background: #000; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; z-index: 1; }
  .skyline img { height: 100%; width: auto; }
</style>
</head>
<body>
  <div class="copy">
    <div class="lockup"><img src="../../public/brand/mark.svg" alt=""><div class="names" id="names"></div></div>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </div>
  <div class="phone"><div class="bezel"><div class="screen"><img src="../../public/img/ios-route-riyadh.webp" alt=""><span class="island"></span></div></div></div>
  <div class="skyline" dir="ltr">
    <img src="../../public/landmarks/sa-silhouette.svg"><img src="../../public/landmarks/bh-silhouette.svg"><img src="../../public/landmarks/tr-silhouette.svg"><img src="../../public/landmarks/eg-silhouette.svg"><img src="../../public/landmarks/sy-silhouette.svg">
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get("lang") || "en";
    const t = {
      en: { title: "Making transportation easier wherever you go.", sub: "Nine cities in five countries, in three languages." },
      ar: { title: "نُسهّل التنقّل أينما ذهبت.", sub: "تسع مدن في خمس دول، بثلاث لغات." },
      tr: { title: "Nereye giderseniz gidin, ulaşımı kolaylaştırıyoruz.", sub: "Beş ülkede dokuz şehir, üç dilde." },
    }[lang];
    document.documentElement.lang = lang;
    document.body.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("title").textContent = t.title;
    document.getElementById("sub").textContent = t.sub;
    const latin = '<span class="latin">Murtahil</span>', arabic = '<span class="arabic">مرتحل</span>';
    document.getElementById("names").innerHTML = lang === "ar" ? arabic + latin : latin + arabic;
  </script>
</body>
</html>
