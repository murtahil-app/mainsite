<?xml version="1.0" encoding="UTF-8"?>
<!--
  Murtahil mark, vector master. The Kingdom Tower (Harbor, rounded top) with the
  metro passing through its opening: Route Green, Forest and Signal rings, the
  train's Harbor face, Sky glass with its Signal-blue highlight, and the Ice lamp.

  Traced from the identity's mark.png (409 x 512) in that pixel space, so 1 unit
  is 1 px of the original. The opening is symmetric about x = 201.3, which is
  3.2 units left of the tower's centre, exactly as in the source artwork; the
  phone icon centres the opening, not the tower.

  Rasterised with rsvg-convert at 409 x 512 and compared with mark.png: mean
  absolute channel error 0.27 / 255, mean RGB distance 0.53; differences are
  confined to anti-aliased edge pixels.

  Rules (DESIGN.md): the tower always appears in full with its opening; never
  recolour it, crop the opening, or add effects, outlines or shadows.
  Exports: Android brand_tower*.xml VectorDrawables, iOS LaunchMark and
  LaunchTower image sets and MurtahilMarkShape.swift (see export_mark.py).
-->
